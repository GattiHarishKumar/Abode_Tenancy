spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000
      pool-name: AbodeNeonHikariCP
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://*.vercel.app,http://localhost:3000}

security:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 86400000
    refresh-token-expiration-ms: 604800000
  otp:
    mock-enabled: true
    default-otp: "123456"

storage:
  type: local
  local:
    base-path: /tmp/uploads

management:
  health:
    redis:
      enabled: false

logging:
  level:
    root: INFO
    com.abode.tenancy: INFO

