spring:
  datasource:
    url: jdbc:h2:mem:abodedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

security:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration-ms: 86400000
    refresh-token-expiration-ms: 604800000
  otp:
    mock-enabled: true
    default-otp: "123456"

storage:
  type: local
  local:
    base-path: ./uploads

logging:
  level:
    root: INFO
    com.abode.tenancy: INFO

