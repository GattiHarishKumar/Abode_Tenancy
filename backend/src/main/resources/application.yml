server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: abode-tenancy-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/abode_tenancy}
    username: ${DB_USER:abode_user}
    password: ${DB_PASSWORD:abode_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000
      pool-name: AbodeHikariCP
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

security:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970} # 256-bit key
    access-token-expiration-ms: 86400000 # 24 hours
    refresh-token-expiration-ms: 604800000 # 7 days
  otp:
    mock-enabled: true # In development/test mode, OTP is logged or defaults to 123456
    default-otp: "123456"

storage:
  type: ${STORAGE_TYPE:local} # local, s3, minio
  local:
    base-path: ${STORAGE_PATH:./uploads}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket-name: ${S3_BUCKET:abode-tenancy-docs}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    region: ${S3_REGION:us-east-1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.abode.tenancy: DEBUG
    org.springframework.security: INFO

